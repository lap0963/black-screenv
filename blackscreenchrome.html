<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Screen</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;            /* Full viewport width */
    height: 100vh;           /* Full viewport height */
    background-color: black;  /* Full black screen */
    overflow: hidden;         /* Prevent scrolling */
    cursor: none;             /* Hide mouse cursor */
    user-select: none;        /* Prevent text selection */
    touch-action: none;       /* Disable touch gestures */
  }

  /* Prevent any accidental focus outlines or interactions */
  * {
    outline: none;
  }
</style>
</head>
<body>
</body>
</html>
