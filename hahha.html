  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARNING!</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: black;
    color: red;
    font-family: "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    user-select: none;
    cursor: none;
    overflow: hidden;
  }
  #message {
    font-size: 48px;
    font-weight: bold;
    text-shadow: 2px 2px 10px #ff0000;
    animation: flash 1s infinite alternate;
  }
  #exitBtn {
    margin-top: 40px;
    font-size: 24px;
    padding: 15px 30px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background-color: white;
    color: black;
    font-weight: bold;
    display: block;
  }
  @keyframes flash {
    0% { color: red; }
    50% { color: yellow; }
    100% { color: red; }
  }
</style>
</head>
<body>

<div id="message">!!! SYSTEM ALERT !!!<br>Your computer may be infected!</div>
<button id="exitBtn">.</button>

<script>
let popupInterval;

// Make page fullscreen
function goFullscreen() {
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
        document.documentElement.webkitRequestFullscreen();
    } else if (document.documentElement.msRequestFullscreen) { /* IE11 */
        document.documentElement.msRequestFullscreen();
    }
}
goFullscreen();

// Start repeating fake popups
function fakePopup() {
    alert("SYSTEM ALERT!\n\nYour computer may be infected!\n\n");
}
popupInterval = setInterval(fakePopup, 2000);

// Exit safely
function exitPrank() {
    clearInterval(popupInterval);
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
    document.body.innerHTML = "<h1 style='color:green; font-size:48px'>Prank Closed Safely!</h1>";
}

// Exit on button click
document.getElementById('exitBtn').addEventListener('click', exitPrank);

// Exit on ESC key
document.addEventListener('keydown', function(e){
    if(e.key === "Escape"){
        exitPrank();
    }
});
</script>

</body>
</html>
